<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viewport diagnostic</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; font-family: -apple-system, Helvetica, Arial, sans-serif; }
  /* A full-bleed block at the very top of the document, exactly like the first
     grid tile: same position in flow, no padding or margin anywhere above it. */
  #bleed { position: relative; width: 100%; height: 46vh; background: #d1483f; }
  #label { position: absolute; left: 14px; bottom: 12px; color: #fff; font-size: 15px; font-weight: 600; }
  #out { padding: 18px 16px 60px; font-size: 15px; line-height: 22px; }
  b { font-weight: 700; }
  .k { color: #888; }
</style>
</head>
<body>
<div id="bleed"><div id="label">RED SHOULD TOUCH THE TOP OF THE SCREEN</div></div>
<div id="out">measuring…</div>
<script>
  var probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;top:0;left:0;height:env(safe-area-inset-top,0px);width:1px;';
  document.body.appendChild(probe);
  var inset = probe.getBoundingClientRect().height;
  var b = document.getElementById('bleed').getBoundingClientRect();
  var vv = window.visualViewport || {};
  var rows = [
    ['safe-area-inset-top', inset + 'px'],
    ['red block top', b.top + 'px'],
    ['window.innerHeight', window.innerHeight],
    ['screen.height', screen.height],
    ['visualViewport.height', vv.height != null ? Math.round(vv.height) : 'n/a'],
    ['visualViewport.offsetTop', vv.offsetTop != null ? vv.offsetTop : 'n/a'],
    ['devicePixelRatio', window.devicePixelRatio],
    ['standalone', ('standalone' in navigator) ? String(navigator.standalone) : 'n/a'],
    ['reduced motion', String(matchMedia('(prefers-reduced-motion: reduce)').matches)],
    ['viewport meta count', document.querySelectorAll('meta[name=viewport]').length]
  ];
  document.getElementById('out').innerHTML = rows
    .map(function (r) { return '<span class="k">' + r[0] + ':</span> <b>' + r[1] + '</b>'; })
    .join('<br>');
</script>
</body>
</html>
